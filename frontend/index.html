<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/Only_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchPad — Placement Portal</title>
    <meta name="description" content="LaunchPad is a placement portal connecting students with recruiters and streamlining the hiring process.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
      /* ── Brand Colour Tokens ── */
      :root {
        --brand-eerie-black:   #27231E;
        --brand-slate-gray:    #3A5253;
        --brand-cambridge:     #81B29A;
        --brand-snow:          #FFF5F5;
        --brand-sienna:        #E07A5F;

        /* Aliases */
        --brand-primary:       var(--brand-slate-gray);
        --brand-secondary:     var(--brand-cambridge);
        --brand-accent:        var(--brand-sienna);
        --brand-bg:            var(--brand-snow);
        --brand-dark:          var(--brand-eerie-black);

        font-family: 'Inter', system-ui, sans-serif;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--brand-snow);
        color: var(--brand-dark);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFDJgKPJu8SjPDRmBaJvRBRYFdK" crossorigin="anonymous"></script>
  </body>
</html>
